
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Halloween 2026</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #111;
      color: white;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    p {
      color: #ccc;
    }

    button {
      padding: 15px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #estado {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>🎃 Scanner Halloween 2026</h1>

  <p>Aponte a câmara para o QR Code do bilhete</p>

  <button onclick="testarLigacao()">
    TESTAR LIGAÇÃO AO GOOGLE
  </button>

  <div id="reader"></div>

  <div id="estado">
    A iniciar a câmara...
  </div>

  <script>
    const URL_APPS_SCRIPT =
      'https://script.google.com/macros/s/AKfycbwNjeW0mFSIqSSjyxuukpKrWF4vc1eurM_Dh_9lQl4z1SuRLEmk247T_ZdzV0qHjSoM/exec';

    const estado = document.getElementById('estado');
    const scanner = new Html5Qrcode('reader');

    let bloqueado = false;

    async function testarLigacao() {
      estado.textContent = 'A consultar bilhete de teste...';

      try {
        const resposta = await fetch(URL_APPS_SCRIPT, {
          method: 'POST',
          body: new URLSearchParams({
            bilhete: 'HAL-2026-0033'
          })
        });

        if (!resposta.ok) {
          throw new Error('HTTP ' + resposta.status);
        }

        const dados = await resposta.json();

        estado.textContent =
          JSON.stringify(dados, null, 2);

      } catch (erro) {
        estado.textContent =
          'Não foi possível ler a resposta do Google: ' +
          erro.message;
      }
    }

    function qrLido(textoQR) {
      if (bloqueado) return;

      bloqueado = true;

      estado.textContent =
        'QR Code lido: ' + textoQR;

      scanner.stop().catch(() => {});
    }

    Html5Qrcode.getCameras()
      .then(cameras => {
        if (!cameras || cameras.length === 0) {
          estado.textContent =
            '❌ Não foi encontrada nenhuma câmara.';
          return;
        }

        let camera = cameras[0];

        for (const c of cameras) {
          const nome = (c.label || '').toLowerCase();

          if (
            nome.includes('back') ||
            nome.includes('rear') ||
            nome.includes('environment') ||
            nome.includes('traseira')
          ) {
            camera = c;
            break;
          }
        }

        return scanner.start(
          camera.id,
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          qrLido,
          () => {}
        );
      })
      .then(() => {
        if (!bloqueado) {
          estado.textContent = '📷 Câmara pronta';
        }
      })
      .catch(erro => {
        estado.textContent =
          '❌ Não foi possível iniciar a câmara: ' +
          erro.message;
      });
  </script>

</body>
</html>
